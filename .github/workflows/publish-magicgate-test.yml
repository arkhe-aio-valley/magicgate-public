name: Publish MagicGate Test Distribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-magicgate-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch and verify validated distribution
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0d94-820e-8990-94667d31a67b/raw?se=2026-09-06T18%3A43%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=65f188aa-4210-5298-8b56-1f3176e7e6e2&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T17%3A02%3A17Z&ske=2026-09-07T17%3A02%3A17Z&sks=b&skv=2026-02-06&sig=I1DbpFHNuasulVo76siqk74c8NahhWOx89vv2jkFwSA%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/MagicGate-Test-v0.3.0.zip
          echo "846192ade96d37ddaca1ba8ab27b0151bceb781981ca6e54ab9a2c65388d1d38  artifact/MagicGate-Test-v0.3.0.zip" | sha256sum -c -
          (cd artifact/distribution && sha256sum -c SHA256SUMS.txt)

      - name: Publish public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.0"
          assets=(
            "artifact/MagicGate-Test-v0.3.0.zip"
            "artifact/distribution/magicgate-vscode-0.1.0.vsix"
            "artifact/distribution/magicgate-macos-0.3.0"
            "artifact/distribution/install-magicgate.sh"
            "artifact/distribution/README-INSTALL.txt"
            "artifact/distribution/SHA256SUMS.txt"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "MagicGate v0.3.0 - Test Distribution" --notes "Pacote público oficial de avaliação do MagicGate v0.3.0. Inclui executável macOS, extensão VS Code, instalador e checksums. A API Key de trial é emitida separadamente pelo site oficial e não é incorporada aos binários."
          fi
