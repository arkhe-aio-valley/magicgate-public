name: Public Repository Daily Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repository-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Block source code and sensitive material
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch all remote branches for historical verification
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Run mandatory public repository guard
        run: |
          set -euo pipefail
          python3 .github/scripts/public_repository_guard.py
