name: Verify MagicGate public distribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-magicgate-public.yml
  workflow_run:
    workflows: ['Publish trial-enforced MagicGate distribution']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public site and health endpoint
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 https://magicgate.dev/ -o /tmp/site.html; then break; fi
            [ "$i" = 5 ] && exit 1
            sleep 2
          done
          grep -q 'MAGICGATE v0.3.0' /tmp/site.html
          curl --fail --silent --show-error https://magicgate.dev/api/_healthcheck | grep -q '"status":"ok"'
      - name: Verify public download redirect and package hash
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header /tmp/headers --output /dev/null https://magicgate.dev/api/package/download
          tr -d '\r' < /tmp/headers | grep -qi '^location: https://github.com/arkhe-aio-valley/magicgate-public/releases/download/v0.3.0/MagicGate-Test-v0.3.0.zip$'
          curl --fail --location --silent --show-error --retry 3 https://magicgate.dev/api/package/download -o /tmp/MagicGate-Test-v0.3.0.zip
          echo '6857809ef26ef9a0ad3b715d752b88a109884c0129ec26d058bcdd2dbb364f53  /tmp/MagicGate-Test-v0.3.0.zip' | sha256sum -c -
          unzip -l /tmp/MagicGate-Test-v0.3.0.zip | tee /tmp/zip-list.txt
          grep -q 'magicgate-macos-0.3.0' /tmp/zip-list.txt
          grep -q 'magicgate-vscode-0.1.0.vsix' /tmp/zip-list.txt
          grep -q 'magicgate-trial' /tmp/zip-list.txt
          grep -q 'install-magicgate.sh' /tmp/zip-list.txt
      - name: Verify invalid key fails closed
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/invalid.json --write-out '%{http_code}' -X POST https://magicgate.dev/api/trial/validate -H 'content-type: application/json' --data '{"api_key":"mg_trial_invalid"}')"
          test "$code" = '401'
