name: Documentation Language Parity

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/documentation-language-parity.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/workflows/documentation-language-parity.yml'

permissions:
  contents: read

jobs:
  language-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PT-BR and EN document pairs
        shell: bash
        run: |
          set -euo pipefail

          failures=0

          while IFS= read -r file; do
            file="${file#./}"

            if [[ "$file" == *.en.md ]]; then
              pair="${file%.en.md}.md"
            else
              pair="${file%.md}.en.md"
            fi

            if [[ ! -f "$pair" ]]; then
              echo "Missing language pair: $file -> $pair"
              failures=1
            fi

            if ! grep -q 'Português' "$file" || ! grep -q 'English' "$file"; then
              echo "Missing language navigation: $file"
              failures=1
            fi
          done < <(find . -type f -name '*.md' -not -path './.git/*' | sort)

          if [[ "$failures" -ne 0 ]]; then
            echo 'Documentation language parity check failed.'
            exit 1
          fi

          echo 'Documentation language parity check passed.'
